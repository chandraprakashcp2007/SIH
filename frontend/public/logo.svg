<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Tactical Shield -->
  <polygon points="24,3 43,10 43,26 24,45 5,26 5,10" fill="#0B1726" stroke="#22364A" stroke-width="2"/>
  
  <!-- Radar sweep rings -->
  <circle cx="24" cy="22" r="14" stroke="#27C7E8" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
  <circle cx="24" cy="22" r="8" stroke="#27C7E8" stroke-width="1" opacity="0.6"/>
  
  <!-- Central Pulse Core -->
  <circle cx="24" cy="22" r="3" fill="#27C7E8"/>

  <!-- Three Environmental Elemental Accents -->
  <!-- Water Wave (Blue/Cyan - Bottom Left) -->

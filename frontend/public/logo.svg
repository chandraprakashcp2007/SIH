  <!-- Fire Flame (Amber/Orange - Top Center) -->
  <path d="M24,10 C26,14 28,16 27,18 C25,18 24,15 24,10 Z" fill="#F97316"/>
  
  <!-- Earth Contour / Landslide (Green - Bottom Right) -->
